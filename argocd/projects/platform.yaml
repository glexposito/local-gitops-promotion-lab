# Platform-owned: namespace/quota/RBAC governance (manifests-internal,
# manifests-stg, manifests-prod, manifests-management) - the layer with
# cluster-scoped access, so it's kept separate from workload projects like
# pulse-api, which get none at all.
#
# sync-wave -1 so the AppProjects get created before the ApplicationSets
# (argocd/appsets/) generate Applications that reference them - an
# Application referencing a project that doesn't exist yet fails validation.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: >-
    Namespace/quota/RBAC governance and the app-of-apps bootstrap itself.
    Not for workloads - see the pulse-api project.
  sourceRepos:
    - https://github.com/glexposito/local-gitops-promotion-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
    - server: https://k3s-internal:6443
      namespace: '*'
    - server: https://k3s-stg:6443
      namespace: '*'
    - server: https://k3s-prod:6443
      namespace: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
