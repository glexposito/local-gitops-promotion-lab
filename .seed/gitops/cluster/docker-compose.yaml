# The local stand-in for real cluster infrastructure (what Terraform/
# Terragrunt would provision): four k3s clusters, Argo CD on management,
# and the one-shot bootstrap. Kargo is not a
# Compose service: Argo CD installs it on management (argocd/kargo/).
#
# Nothing in cluster/ is read by Argo CD - everything it syncs lives outside
# this directory (argocd/, apps/, manifests/). The outer template's
# compose.yaml includes this file; run `docker compose up -d` from its root.

# Fixed project name, so volumes stay local-gitops-promotion-lab_* no matter which
# directory this file lives in.
name: local-gitops-promotion-lab

# Shared by the four k3s servers.
x-k3s: &k3s
  image: docker.io/rancher/k3s:v1.36.2-k3s1
  privileged: true
  healthcheck:
    test: ["CMD-SHELL", "kubectl wait --for=create node --all --timeout=3s && kubectl wait --for=condition=ready node --all --timeout=3s"]
    interval: 5s
    timeout: 10s
    retries: 60
    start_period: 10s

services:
  # Workload clusters: each one is one promotion stage. Each auto-applies
  # its manifests/<cluster>/ on start (namespace, quota, policies, and the
  # argocd-manager ServiceAccount Argo CD uses to manage it).
  internal:
    <<: *k3s
    container_name: k3s-internal
    hostname: k3s-internal
    command: [server, --node-name=internal, --tls-san=localhost, --tls-san=k3s-internal]
    ports:
      - "6444:6443"
      - "8081:30080"   # pulse-api NodePort (apps/pulse-api/base/service.yaml)
    volumes:
      - internal-data:/var/lib/rancher/k3s
      - internal-kubeconfig:/etc/rancher/k3s
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      - ../manifests/internal:/var/lib/rancher/k3s/server/manifests/custom:ro
    networks:
      k8s-management:
        # Fixed IPs let manifests/management/05-cluster-dns.yaml be static,
        # git-committed YAML instead of something discovered at runtime.
        ipv4_address: 172.28.0.101

  stg:
    <<: *k3s
    container_name: k3s-stg
    hostname: k3s-stg
    command: [server, --node-name=stg, --tls-san=localhost, --tls-san=k3s-stg]
    ports:
      - "6446:6443"
      - "8082:30080"
    volumes:
      - stg-data:/var/lib/rancher/k3s
      - stg-kubeconfig:/etc/rancher/k3s
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      - ../manifests/stg:/var/lib/rancher/k3s/server/manifests/custom:ro
    networks:
      k8s-management:
        ipv4_address: 172.28.0.102

  prod:
    <<: *k3s
    container_name: k3s-prod
    hostname: k3s-prod
    command: [server, --node-name=prod, --tls-san=localhost, --tls-san=k3s-prod]
    ports:
      - "6445:6443"
      - "8083:30080"
    volumes:
      - prod-data:/var/lib/rancher/k3s
      - prod-kubeconfig:/etc/rancher/k3s
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      - ../manifests/prod:/var/lib/rancher/k3s/server/manifests/custom:ro
    networks:
      k8s-management:
        ipv4_address: 172.28.0.103

  # The hub: runs only Argo CD, no workloads. Losing or rebuilding a
  # workload cluster never takes down the thing that manages it.
  management:
    <<: *k3s
    container_name: k3s-management
    hostname: k3s-management
    command: [server, --node-name=management, --tls-san=localhost, --tls-san=k3s-management]
    ports:
      - "6447:6443"
      - "9000:30090"   # Argo CD UI (NodePort set in argocd-install.yaml)
      - "9001:30091"   # Kargo UI (NodePort set in argocd/kargo/install.yaml)
    volumes:
      - management-data:/var/lib/rancher/k3s
      - management-kubeconfig:/etc/rancher/k3s
      # Lets every node pull the POC's optional local-registry images.
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      - ../manifests/management:/var/lib/rancher/k3s/server/manifests/custom:ro
      # k3s installs Argo CD from this HelmChart on start.
      - ./argocd-install.yaml:/var/lib/rancher/k3s/server/manifests/argocd-install.yaml:ro
    networks:
      k8s-management:
        ipv4_address: 172.28.0.104

  # One-shot (bootstrap.sh): registers internal/stg/prod with Argo CD,
  # creates Kargo's git credential, and applies the root Application. Reuses the k3s image for its kubectl.
  # If one cluster's volume gets rebuilt, re-register it with
  #   docker compose up -d --force-recreate argocd-bootstrap
  argocd-bootstrap:
    image: docker.io/rancher/k3s:v1.36.2-k3s1
    container_name: argocd-bootstrap
    depends_on:
      internal: { condition: service_healthy }
      stg: { condition: service_healthy }
      prod: { condition: service_healthy }
      management: { condition: service_healthy }
    volumes:
      - internal-kubeconfig:/kubeconfigs/internal:ro
      - stg-kubeconfig:/kubeconfigs/stg:ro
      - prod-kubeconfig:/kubeconfigs/prod:ro
      - management-kubeconfig:/kubeconfigs/management:ro
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ../argocd/root-app.yaml:/argocd/root-app.yaml:ro
      # Gitignored credentials (docs/kargo.md), e.g. Kargo's git write key.
      - ./secrets:/secrets:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    networks:
      - k8s-management

volumes:
  internal-data:
  stg-data:
  prod-data:
  management-data:
  internal-kubeconfig:
  stg-kubeconfig:
  prod-kubeconfig:
  management-kubeconfig:

networks:
  k8s-management:
    driver: bridge
    # A defined subnet is required to pin the clusters' IPs above.
    ipam:
      config:
        - subnet: 172.28.0.0/24
