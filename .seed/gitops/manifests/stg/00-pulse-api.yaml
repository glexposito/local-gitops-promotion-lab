# pulse-api's namespace + guardrails on this cluster. Deployed by
# argocd/appsets/pulse-api.yaml; the image digest per stage is promoted
# through apps/pulse-api/overlays/<stage>.
apiVersion: v1
kind: Namespace
metadata:
  name: pulse-api
  labels:
    environment: stg
    stage: stg
    cost-center: cc-2000
    managed-by: gitops-poc
---
# 2 replica(s) (apps/pulse-api/overlays/stg) + 1 surge pod during a rollout, with
# headroom to spare - pulse-api is a tiny static Rust binary.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pulse-api-quota
  namespace: pulse-api
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: pulse-api
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 10m
        memory: 16Mi
---
# pulse-api is an API: besides same-namespace
# traffic, it accepts its HTTP port from anywhere, so the NodePort
# (30080) is reachable - that's what Kargo's e2e verification Job on
# management hits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-http
  namespace: pulse-api
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 8080
          protocol: TCP
