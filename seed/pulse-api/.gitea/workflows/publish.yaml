name: Publish pulse-api

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: local
    # The job image (bootstrap/Dockerfile, docker:27-cli on Alpine) has no
    # bash, which is the runner's default shell.
    defaults:
      run:
        shell: sh
    steps:
      # The Rust compile happens inside the Dockerfile's builder stage
      # (cargo build --release for musl), so "docker build" is the build.
      - name: Build images
        run: |
          set -eu
          git clone --no-checkout http://gitea:3000/local/pulse-api.git source
          cd source
          git checkout --detach "$GITHUB_SHA"
          tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          # Kargo's NewestBuild picks by creation time. With the layer cache
          # a rebuild keeps the cached timestamp, so a new commit can look as
          # old as the last one and never become Freight. Kargo trusts the
          # later of that and this label, so stamp the real build time.
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build -t "localhost:5000/pulse-api:$tag" \
            --label "org.opencontainers.image.created=$created" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker build -t "localhost:5000/pulse-api-e2e:$tag" \
            --label "org.opencontainers.image.created=$created" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" e2e

      - name: Push images
        run: |
          set -eu
          docker push "localhost:5000/pulse-api:$TAG"
          docker push "localhost:5000/pulse-api-e2e:$TAG"
          echo "Published $TAG. Kargo will discover it as registry.local:5000/pulse-api."
