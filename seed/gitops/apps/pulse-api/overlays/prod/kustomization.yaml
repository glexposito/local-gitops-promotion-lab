# pulse-api on prod: replica count and the image it runs.
#
# images: pins an exact digest, never a tag - starts on the image built
# from glexposito/pulse-api@247711f (tag sha-247711f).
# Kargo (kargo/shared/promote-kustomize-app.yaml) then replaces the
# digest here once the build passed the previous stage's e2e.
# Don't hand-edit it unless you mean to deploy (or roll back).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
replicas:
- count: 3
  name: pulse-api
images:
- name: ghcr.io/glexposito/pulse-api
  digest: sha256:a0544d191ba6c08ba8b5b87b371dd5f5dee7bb21768023939e493514de6e83be
