# Shared by every stage. overlays/<stage> only pins the image digest that
# stage runs - promoted by Kargo, one stage at a time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: pulse-api
    includeSelectors: true
  - pairs:
      app.kubernetes.io/component: api
      app.kubernetes.io/managed-by: kustomize
