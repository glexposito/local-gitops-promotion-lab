# NodePort so Kargo's e2e verification Job on management can reach each
# cluster's pulse-api at http://k3s-<stage>:30080 - no ingress, no
# port-forward. Same port on every cluster is fine: each is its own node.
apiVersion: v1
kind: Service
metadata:
  name: pulse-api
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
      name: http
