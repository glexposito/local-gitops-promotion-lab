# Argo CD itself, installed by k3s on the management cluster: Compose
# mounts this into k3s's auto-deploy manifests directory. It lives in
# cluster/ because Argo CD doesn't manage its own install here.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.8.4 # Argo CD v3.5.2
  targetNamespace: argocd
  createNamespace: true
  timeout: 600s
  # Keep an existing release on failure instead of uninstalling it and retrying.
  failurePolicy: abort
  valuesContent: |-
    fullnameOverride: argocd
    controller:
      resources:
        requests:
          cpu: 375m
          memory: 512Mi
        limits:
          cpu: 750m
          memory: 1024Mi
    # PoC-only: fixed admin/123 login and a NodePort so the UI is reachable
    # the moment this Helm install finishes - no kubectl port-forward
    # process, no script, nothing to run by hand. Weak on purpose; this
    # never leaves localhost (see docker-compose.yaml's management port
    # mapping).
    # Hash generated with:
    #   docker run --rm httpd:2.4-alpine htpasswd -nbBC 10 "" 123 | tr -d ':\n'
    configs:
      # Argo CD's external URL - used in CLI output and notification links.
      # The chart's default (from global.domain) is argocd.example.com.
      cm:
        url: https://localhost:9000
      secret:
        argocdServerAdminPassword: "$2a$10$zG/yvDMqlg9VStNvqCftBe3UVYc53FK5Gh47BWpeMuBl4vYQf3ini"
        argocdServerAdminPasswordMtime: "2024-01-01T00:00:00Z"
    server:
      service:
        type: NodePort
        nodePortHttps: 30090
