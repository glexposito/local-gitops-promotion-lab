# Local-only services. The root compose.yaml includes this file, so first boot
# is simply: docker compose up -d
#
# local-bootstrap runs once in a Linux container. It initializes the two
# visible repository directories in the host bind mount, creates their Gitea
# remotes, and exits. Argo CD's
# bootstrap waits for it, so it can never try to clone GitOps before Gitea has
# the initial commit.
services:
  gitea:
    image: docker.gitea.com/gitea:28.3.0
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: gitea.local
      GITEA__server__ROOT_URL: http://gitea.local:3000/
      GITEA__server__HTTP_PORT: 3000
      # CLI commands that call the internal API (gitea-init) run in another
      # container, so localhost would not reach this server.
      GITEA__server__LOCAL_ROOT_URL: http://gitea:3000/
      GITEA__server__DISABLE_SSH: "true"
      # This is an unattended lab setup, not a browser-wizard installation.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__actions__ENABLED: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 10s
      start_interval: 2s
      start_period: 2m
      retries: 3
    networks:
      k8s-management:
        ipv4_address: 172.28.0.105
        aliases: [gitea.local]

  # Gitea has no environment variable for creating its first admin. This
  # short-lived companion uses the same data volume and the official image's
  # CLI; it is not a host-side docker exec.
  gitea-init:
    image: docker.gitea.com/gitea:28.3.0
    # The Gitea CLI refuses to run as root; the image's server runs as git.
    user: git
    depends_on:
      gitea:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until test -f /data/gitea/conf/app.ini; do sleep 1; done
        until gitea --config /data/gitea/conf/app.ini admin user list | grep -q 'local@example.test'; do
          gitea --config /data/gitea/conf/app.ini admin user create --admin --username local --password local-123 \
            --email local@example.test --must-change-password=false || true
          sleep 1
        done
        until test -s /data/gitea/local-runner-token; do
          if gitea --config /data/gitea/conf/app.ini actions generate-runner-token --scope local \
            > /data/gitea/local-runner-token.tmp; then
            chmod 600 /data/gitea/local-runner-token.tmp
            mv /data/gitea/local-runner-token.tmp /data/gitea/local-runner-token
          else
            sleep 1
          fi
        done
    volumes:
      - gitea-data:/data
    # generate-runner-token calls Gitea's internal API at LOCAL_ROOT_URL
    # (http://gitea:3000), so it must share Gitea's network to resolve "gitea".
    networks:
      - k8s-management

  # Kargo lists registry tags over HTTPS only (insecureSkipTLSVerify skips
  # certificate checks, it does not allow plain HTTP), so the registry serves
  # TLS with a self-signed certificate generated on first start. It lives in a
  # volume, so no key is committed and `down -v` discards it with the lab.
  registry-cert:
    image: docker.io/alpine/openssl:3.5.4
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -s /certs/registry.crt ] && [ -s /certs/registry.key ]; then
          exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout /certs/registry.key -out /certs/registry.crt \
          -subj /CN=registry.local \
          -addext subjectAltName=DNS:registry.local,DNS:localhost,IP:127.0.0.1
    volumes:
      - registry-certs:/certs

  # k3s nodes trust it via registries.yaml (insecure_skip_verify), Kargo via
  # insecureSkipTLSVerify, and the host Docker daemon pushing to localhost:5000
  # because Docker treats localhost registries as insecure by default.
  registry:
    image: docker.io/library/registry:3.0.0
    depends_on:
      registry-cert:
        condition: service_completed_successfully
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - registry-certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://localhost:5000/v2/"]
      interval: 10s
      start_interval: 2s
      start_period: 1m
      retries: 3
    networks:
      k8s-management:
        ipv4_address: 172.28.0.106
        aliases: [registry.local]

  local-bootstrap:
    build:
      context: ../../../bootstrap
    image: local-gitops-promotion-lab-tools
    depends_on:
      gitea-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/local-bootstrap"]
    volumes:
      - ../../../:/lab
    networks:
      - k8s-management

  # It starts after the first push has created local/pulse-api, then receives
  # every later push from Gitea. Jobs use the trusted lab's host Docker daemon
  # to build and push the app images.
  gitea-runner:
    image: docker.io/gitea/runner:2
    depends_on:
      local-bootstrap:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /gitea-data/gitea/local-runner-token
      GITEA_RUNNER_NAME: local-pulse-api
      GITEA_RUNNER_LABELS: local:docker://local-gitops-promotion-lab-tools
    volumes:
      - gitea-data:/gitea-data:ro
      - gitea-runner-data:/data
      - ./runner-config.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - k8s-management

  # The base bootstrap is reused, but its Git source and Kargo write
  # credential become the local Gitea repository. It waits for the one-shot
  # bootstrap so this local repository exists before Argo CD starts syncing.
  argocd-bootstrap:
    depends_on:
      local-bootstrap:
        condition: service_completed_successfully
    environment:
      GITOPS_REPO_URL: http://gitea.local:3000/local/gitops.git
      KARGO_GIT_REPO_URL: http://gitea.local:3000/local/gitops.git
      KARGO_GIT_USERNAME: local
      KARGO_GIT_PASSWORD: local-123

  # Lab readiness: healthy only once pulse-api is deployed on internal, i.e.
  # the whole flow works (build -> registry -> Kargo -> Argo CD). Container
  # health alone can't say that. `docker compose up -d --wait` blocks on it;
  # `docker compose logs -f lab-ready` shows which phase startup is in.
  lab-ready:
    image: docker.io/rancher/k3s:v1.36.2-k3s1
    depends_on:
      argocd-bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/lab-ready.sh"]
    volumes:
      - management-kubeconfig:/kubeconfigs/management:ro
      - ./lab-ready.sh:/lab-ready.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      start_interval: 5s
      # A first start takes several minutes; only call it unhealthy after 20.
      start_period: 20m
      retries: 3
    networks:
      - k8s-management

volumes:
  gitea-data:
  registry-data:
  registry-certs:
  gitea-runner-data:
