# The local-only Compose profile serves application images from registry.local
# over HTTPS with a self-signed certificate (see the registry-cert service in
# compose.local-platform.yaml). K3s nodes skip verifying it only inside this
# disposable Docker network; do not copy this setting to a real cluster.
mirrors:
  "registry.local:5000":
    endpoint:
      - "https://registry.local:5000"
configs:
  "registry.local:5000":
    tls:
      insecure_skip_verify: true
