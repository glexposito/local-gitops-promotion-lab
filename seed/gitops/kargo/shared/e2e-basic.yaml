# Verification for lightweight test images (bash/curl, API checks). Shared
# by every app that picks it (verification: in kargo/apps/<app>.yaml).
#
# The contract with an app's e2e image: it takes the base URL as its only
# argument (also given as BASE_URL), and exits 0 when every check passes.
# Argo Rollouts runs it as a Job in the app's Kargo Project namespace on
# management; exit 0 marks the Freight verified in that stage.
#
# Reaches k3s-<stage> through management's CoreDNS overrides
# (manifests/management/05-cluster-dns.yaml), the same way Argo CD does.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: e2e-basic
spec:
  args:
    - name: base-url
    - name: e2e-image
  metrics:
    - name: e2e
      provider:
        job:
          spec:
            # One attempt: a failing e2e is a failed verification, not
            # something to retry until it passes.
            backoffLimit: 0
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: e2e
                    image: '{{args.e2e-image}}'
                    args: ['{{args.base-url}}']
                    env:
                      - name: BASE_URL
                        value: '{{args.base-url}}'
                    resources:
                      requests:
                        cpu: 50m
                        memory: 32Mi
                      limits:
                        cpu: 500m
                        memory: 128Mi
