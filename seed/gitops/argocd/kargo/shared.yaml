# The Kargo pieces every app shares, cluster-wide (kargo/shared/): the
# promotion steps (ClusterPromotionTask) and the test templates
# (ClusterAnalysisTemplates). Defined once; each app's Stages refer to them
# by name.
#
# SkipDryRunOnMissingResource + retry: on a fresh cluster the Kargo and
# Rollouts CRDs don't exist until argocd/kargo/install.yaml has synced.
# The retry is capped at 30s so it recovers as soon as they exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-shared
  namespace: argocd
  labels:
    layer: promotion
spec:
  project: kargo
  source:
    repoURL: https://github.com/glexposito/local-gitops-promotion-lab.git
    targetRevision: HEAD
    path: kargo/shared
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30   # ~15 min of 30s retries: outlasts a slow first Kargo install
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
